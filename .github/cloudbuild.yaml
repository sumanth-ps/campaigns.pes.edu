steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/campaigns/site:$COMMIT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/campaigns/site:$COMMIT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'campaigns-site'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/campaigns/site:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--port=8080'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY