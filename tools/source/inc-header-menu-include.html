<header id="header" class="header-transparent header-effect-shrink appear-animation"
            data-plugin-options="{'stickyEnabled': true, 'stickyEffect': 'shrink', 'stickyEnableOnBoxed': true, 'stickyEnableOnMobile': false, 'stickyChangeLogo': true, 'stickyStartAt': 30, 'stickyHeaderContainerHeight': 70}"
            data-appear-animation="fadeIn" data-appear-animation-delay="200">
            <div class="header-body border-top-0 header-body-bottom-border">
                <div class="header-container container">
                    <div class="header-row">
                        <div class="header-column">
                            <div class="header-row">
                                <div class="header-logo">
                                    <a href="/">
                                        <img alt="PES University" height="55" data-sticky-height="40"
                                            src="../assets/logo-and-images/pesu-emailer-logo.png">
                                    </a>
                                </div>
                            </div>
                        </div>
                        <div class="header-column justify-content-end">
                            <div class="header-row">
                                <div class="header-nav header-nav-links justify-content-start order-2 order-lg-1">
                                    <div
                                        class="header-nav-main header-nav-main-square header-nav-main-dropdown-no-borders header-nav-main-effect-2 header-nav-main-sub-effect-1">
                                        <nav class="collapse">
                                            <ul class="nav nav-pills" id="mainNav">

                                                <li class="d-lg-none">
                                                    <a class="nav-link" href="https://admissions.pes.edu/registration/"
                                                        target="_blank" data-cursor-effect-hover="plus">
                                                        Register for Admissions
                                                    </a>
                                                </li>
                                            </ul>
                                        </nav>
                                    </div>
                                    <button class="btn header-btn-collapse-nav" data-bs-toggle="collapse"
                                        data-bs-target=".header-nav-main nav">
                                        <i class="fas fa-bars"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div
                            class="header-column header-column-search justify-content-end align-items-center d-flex w-auto flex-row">
                            <a href="https://admissions.pes.edu/registration/" target="_blank"
                                class="btn btn-primary custom-btn-style-1 font-weight-semibold text-3-5 btn-px-3 py-2 ws-nowrap ms-4 d-none d-lg-block"
                                data-cursor-effect-hover="plus" data-cursor-effect-hover-color="light"><span>Register
                                    for Admissions</span></a>
                        </div>
                    </div>
                </div>
            </div>
        </header>
